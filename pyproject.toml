[project]
name = "transformer-nes"
version = "0.1.0"
description = "Analytically constructed transformer circuits for the NES CPU and devices"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
    "ninja>=1.13.0",
    "numpy>=2.0.0",
    "safetensors>=0.8.0",
    "scipy>=1.17.1",
    "setuptools>=82.0.0",
    "torch>=2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "pre-commit>=4.0",
]

[project.scripts]
6502-reference = "transformer_nes.cpu6502.reference:main"
6502-klaus = "transformer_nes.cpu6502.conformance.klaus:main"
6502-nestest = "transformer_nes.cpu6502.conformance.nestest:main"
6502-transformer = "transformer_nes.cpu6502.runner:main"
6502-export = "transformer_nes.cpu6502.checkpoint.export:main"
6502-checkpoint = "transformer_nes.cpu6502.checkpoint.dense_runner:main"
6502-experts = "transformer_nes.cpu6502.checkpoint.expert_runner:main"
nes-run = "transformer_nes.frontend.app:main"

[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["transformer_nes*"]

[tool.setuptools.package-data]
"transformer_nes" = [
    "model/native/*.h",
    "model/native/*.cpp",
    "cpu6502/native/*.h",
    "cpu6502/native/*.cpp",
    "nes/*.cpp",
    "nes/*.m",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["transformer_nes"]

[tool.pytest.ini_options]
testpaths = ["transformer_nes"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
